name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run architecture verification gate
        run: python scripts/verify_architecture.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run real end-to-end task
        run: python examples/real_task.py .