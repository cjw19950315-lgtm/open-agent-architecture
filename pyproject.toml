[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-architecture"
version = "1.2.0"
description = "Runnable 12-Factor AI Agent Architecture runtime with skill routing, DAG execution, session harness, and verification gates"
readme = "README.md"
authors = [{ name = "Open Agent Architecture Maintainers" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]

[project.urls]
"Homepage" = "https://github.com/cjw19950315-lgtm/open-agent-architecture"
"Documentation" = "https://github.com/cjw19950315-lgtm/open-agent-architecture/tree/main/docs"

[project.scripts]
oaa = "oaa.cli:main"

[tool.setuptools]
packages = ["oaa"]